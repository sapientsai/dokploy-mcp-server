allowBuilds:
  esbuild: true
  tldjs: false

# @redocly/openapi-core (via openapi-typescript) pins js-yaml to exactly 4.3.0,
# which is vulnerable to GHSA-5p4m-2wfm-xmqj. 4.3.1 is the patch release.
# Drop this once openapi-typescript ships a Redocly that allows >= 4.3.1.
overrides:
  js-yaml@4.3.0: 4.3.1

minimumReleaseAgeExclude:
  - functype-log@1.5.0
  - functype@1.5.0

# pnpm 11 ignores `public-hoist-pattern` in .npmrc; the canonical home is here.
# Hoists CLI tool binaries from transitive deps so ts-builds can find them.
publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"
  - "*rimraf*"
  - "*cross-env*"
