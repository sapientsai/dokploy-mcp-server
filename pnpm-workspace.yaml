packages:
  - "servers/*"

allowBuilds:
  esbuild: true
  # temporal: wrangler's local Workers runtime links its platform binary on install.
  workerd: true
  tldjs: false

# @redocly/openapi-core (via openapi-typescript) pins js-yaml to exactly 4.3.0,
# which is vulnerable to GHSA-5p4m-2wfm-xmqj. 4.3.1 is the patch release.
# Drop this once openapi-typescript ships a Redocly that allows >= 4.3.1.
overrides:
  js-yaml@4.3.0: 4.3.1
  # rescuetime: eslint (dev only) caps minimatch below GHSA-g3hv-75wg-m249's fix.
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"

minimumReleaseAgeExclude:
  - "*functype*"
  - ts-builds
  - somamcp

# pnpm 11 ignores `public-hoist-pattern` in .npmrc; the canonical home is here.
# Hoists CLI tool binaries from transitive deps so ts-builds can find them.
publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"
  - "*rimraf*"
  - "*cross-env*"
  # microsoft-todo: its eslint.config.js imports globals, which *eslint* doesn't match.
  - "globals"
