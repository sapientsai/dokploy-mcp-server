# Hoist CLI tool binaries from peer dependencies.
# pnpm only reads auth/registry from .npmrc; all other settings live here.
publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"
  - "*rimraf*"
  - "*cross-env*"

# First-party packages we publish ourselves: the release-age cooldown adds no supply-chain value here.
minimumReleaseAgeExclude:
  - "*functype*"
  - ts-builds
  - somamcp

# pnpm 12 requires an explicit choice per dependency build script.
allowBuilds:
  esbuild: false # binary ships via @esbuild/<platform> optional deps
  tldjs: false # postinstall only refreshes its bundled public-suffix list
