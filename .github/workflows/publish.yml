name: Publish to NPM and MCP Registry

on:
  push:
    tags:
      - "v*" # Triggers on version tags like v1.0.0
  # Manual run from main re-publishes the current package.json version: npm is
  # skipped if already published, and the release step needs a tag so it skips.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for GitHub release
      id-token: write # Required for npm provenance and MCP registry OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Check version consistency across package.json / server.json
        run: pnpm check:versions

      - name: Run validation pipeline
        run: pnpm run validate

      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify package contents
        run: |
          echo "Files to be published:"
          npm pack --dry-run

      - name: Publish to npm
        # Skipped when the tarball is already served, so a rerun after a later
        # step fails (e.g. the MCP Registry) doesn't die on "version exists".
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if curl -sfI "https://registry.npmjs.org/$NAME/-/$NAME-$VERSION.tgz" > /dev/null; then
            echo "$NAME@$VERSION tarball already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install MCP Publisher
        # v1.7.6+ required: registry binds the GitHub OIDC token exchange to a
        # per-deployment audience (https://registry.modelcontextprotocol.io)
        # rather than the legacy "mcp-registry" string. Older publisher
        # versions request the legacy audience and the server rejects them
        # with HTTP 401 ("invalid audience").
        # Release: https://github.com/modelcontextprotocol/registry/releases/tag/v1.7.6
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Wait for npm to serve the tarball
        # npm writes version metadata before the tarball, and the MCP Registry
        # rejects a version npm doesn't serve yet. 1.10.0 lost this race by
        # seconds; the tarball took ~6 minutes to appear.
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          URL="https://registry.npmjs.org/$NAME/-/$NAME-$VERSION.tgz"
          for i in $(seq 1 60); do
            if curl -sfI "$URL" > /dev/null; then
              echo "$URL is served"
              exit 0
            fi
            echo "Waiting for $URL ($i/60)"
            sleep 30
          done
          echo "::error::$URL still 404 after 30 minutes"
          exit 1

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
