name: Publish to NPM and MCP Registry

# One workflow for every server. Its file name is part of npm trusted publishing's
# config for each package, so it must keep this name.
#
# A release is the tag <package name>@<version>, which `pnpm release` makes: for
# example dokploy-mcp-server@1.11.3. The tag names the package; its folder is the one
# under servers/ whose package.json has that name.
on:
  push:
    tags:
      - "*@*"
  # A manual run re-publishes one server's current version: npm is skipped if it's
  # already served, and the GitHub release step needs a tag, so it skips.
  workflow_dispatch:
    inputs:
      package:
        description: "Package name, e.g. dokploy-mcp-server"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # covers the wait for npm to serve the tarball
    permissions:
      contents: write # Required for GitHub release
      id-token: write # Required for npm provenance and MCP registry OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Find the package
        id: pkg
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="${TAG%@*}"
            TAG_VERSION="${TAG##*@}"
            if [ -z "$NAME" ] || [ -z "$TAG_VERSION" ]; then
              echo "::error::tag $TAG isn't <package>@<version>"
              exit 1
            fi
          else
            NAME="$INPUT_PACKAGE"
            TAG_VERSION=""
          fi
          DIR=$(node -e '
            const fs = require("fs")
            const name = process.argv[1]
            const hit = fs.readdirSync("servers").find((d) => {
              try { return JSON.parse(fs.readFileSync(`servers/${d}/package.json`, "utf8")).name === name } catch { return false }
            })
            if (!hit) { console.error(`no package named ${name} under servers/`); process.exit(1) }
            console.log(`servers/${hit}`)
          ' "$NAME") || exit 1
          VERSION=$(node -p "require('./$DIR/package.json').version")
          if [ -n "$TAG_VERSION" ] && [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::tag says $TAG_VERSION but $DIR/package.json says $VERSION"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME@$VERSION from $DIR"

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the package's CI
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm run ci

      - name: Verify package contents
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          echo "Files to be published:"
          npm pack --dry-run

      - name: Publish to npm
        # Skipped when the tarball is already served, so a rerun after a later
        # step fails (e.g. the MCP Registry) doesn't die on "version exists".
        # Every server publishes by npm trusted publishing (OIDC). npm tries it before
        # NODE_AUTH_TOKEN, so NPM_TOKEN is only a fallback. Each package's trusted
        # publisher must name this repo and this file. Check _npmUser.trustedPublisher
        # after a release: a stale setting silently falls back to the token.
        # npm is the one bundled with the pinned Node (.nvmrc), never npm@latest.
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if curl -sfI "https://registry.npmjs.org/$NAME/-/$NAME-$VERSION.tgz" > /dev/null; then
            echo "$NAME@$VERSION tarball already on npm; skipping publish"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for server.json
        id: registry
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          if [ -f server.json ]; then echo "listed=true" >> "$GITHUB_OUTPUT"; else echo "listed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install MCP Publisher
        if: steps.registry.outputs.listed == 'true'
        # v1.7.6+ required: registry binds the GitHub OIDC token exchange to a
        # per-deployment audience (https://registry.modelcontextprotocol.io)
        # rather than the legacy "mcp-registry" string. Older publisher
        # versions request the legacy audience and the server rejects them
        # with HTTP 401 ("invalid audience").
        # Release: https://github.com/modelcontextprotocol/registry/releases/tag/v1.7.6
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Wait for npm to serve the tarball
        if: steps.registry.outputs.listed == 'true'
        # npm writes version metadata before the tarball, and the MCP Registry
        # rejects a version npm doesn't serve yet. 1.10.0 lost this race by
        # seconds; the tarball took ~6 minutes to appear.
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          URL="https://registry.npmjs.org/$NAME/-/$NAME-$VERSION.tgz"
          for i in $(seq 1 60); do
            if curl -sfI "$URL" > /dev/null; then
              echo "$URL is served"
              exit 0
            fi
            echo "Waiting for $URL ($i/60)"
            sleep 30
          done
          echo "::error::$URL still 404 after 30 minutes"
          exit 1

      - name: Login to MCP Registry
        if: steps.registry.outputs.listed == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.registry.outputs.listed == 'true'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: "$GITHUB_WORKSPACE/mcp-publisher publish"
