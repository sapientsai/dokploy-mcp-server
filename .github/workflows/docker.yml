name: Docker Build & Push

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build args
        id: args
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Build the host-arch image locally first and prove it serves MCP before
      # anything is pushed. The multi-arch build below reuses this cache.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dokploy-mcp-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e DOKPLOY_URL=http://127.0.0.1:9 -e DOKPLOY_API_KEY=smoke \
            dokploy-mcp-server:smoke
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health > /dev/null || { docker logs smoke; exit 1; }
          HDR=(-H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-06-18')
          INIT=$(curl -s -X POST http://127.0.0.1:3000/mcp "${HDR[@]}" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          echo "$INIT" | grep -q '"name":"dokploy-mcp-server"' || { echo "initialize failed: $INIT"; docker logs smoke; exit 1; }
          TOOLS=$(curl -s -X POST http://127.0.0.1:3000/mcp "${HDR[@]}" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | grep -o '"name":"dokploy_[a-z_]*"' | wc -l)
          [ "$TOOLS" -eq 27 ] || { echo "expected 27 dokploy_* tools, got $TOOLS"; docker logs smoke; exit 1; }
          echo "container serves MCP: health ok, initialize ok, $TOOLS dokploy_* tools"
          docker rm -f smoke

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest follows released semver tags only, never main.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.args.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
