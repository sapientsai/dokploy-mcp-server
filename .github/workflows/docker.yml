name: Docker Build & Push

# dokploy's image only. A release is the tag dokploy-mcp-server@<version>; other
# servers' tags and changes don't build it. Path filters don't apply to tags.
on:
  push:
    branches: ["main"]
    tags: ["dokploy-mcp-server@*"]
    paths:
      - "servers/dokploy/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".nvmrc"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "servers/dokploy/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".nvmrc"
      - ".dockerignore"
      - ".github/workflows/docker.yml"

env:
  REGISTRY: ghcr.io
  # Pinned, not ${{ github.repository }}: the repo is becoming a monorepo under another
  # name, and the image users pull must keep this path.
  IMAGE_NAME: sapientsai/dokploy-mcp-server

# A newer push to a pull request cancels the build it supersedes. A push to main gets a group of its own,
# because GitHub cancels a waiting run when a newer one joins its group, even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build args
        id: args
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # The version a release tag names (dokploy-mcp-server@1.2.3 -> 1.2.3), empty otherwise.
          if [[ "$GITHUB_REF" == refs/tags/dokploy-mcp-server@* ]]; then
            echo "version=${GITHUB_REF#refs/tags/dokploy-mcp-server@}" >> "$GITHUB_OUTPUT"
          fi

      # Build the host-arch image locally first and prove it serves MCP before
      # anything is pushed. The multi-arch build below reuses this cache.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: servers/dokploy/Dockerfile
          load: true
          tags: dokploy-mcp-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 3000:3000 \
            -e DOKPLOY_URL=http://127.0.0.1:9 -e DOKPLOY_API_KEY=smoke \
            dokploy-mcp-server:smoke
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health > /dev/null || { docker logs smoke; exit 1; }
          HDR=(-H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'mcp-protocol-version: 2025-06-18')
          INIT=$(curl -s -X POST http://127.0.0.1:3000/mcp "${HDR[@]}" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}')
          echo "$INIT" | grep -q '"name":"dokploy-mcp-server"' || { echo "initialize failed: $INIT"; docker logs smoke; exit 1; }
          TOOLS=$(curl -s -X POST http://127.0.0.1:3000/mcp "${HDR[@]}" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | grep -o '"name":"dokploy_[a-z_]*"' | wc -l)
          [ "$TOOLS" -eq 27 ] || { echo "expected 27 dokploy_* tools, got $TOOLS"; docker logs smoke; exit 1; }
          echo "container serves MCP: health ok, initialize ok, $TOOLS dokploy_* tools"
          docker rm -f smoke

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest follows released versions only, never main. A release tag isn't plain
      # semver (dokploy-mcp-server@1.2.3), so the semver tags read the parsed version.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ steps.args.outputs.version }},enable=${{ steps.args.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.args.outputs.version }},enable=${{ steps.args.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ steps.args.outputs.version }},enable=${{ steps.args.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.args.outputs.version != '' }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: servers/dokploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_DATE=${{ steps.args.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
